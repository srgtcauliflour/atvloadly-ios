name: ATVLoadly
options:
  bundleIdPrefix: com.srgtcauliflour
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    SWIFT_VERSION: '5.0'
targets:
  ATVLoadly:
    type: application
    platform: iOS
    sources: [ATVLoadly]
    info:
      path: ATVLoadly/Info.plist
      properties:
        NSLocalNetworkUsageDescription: Discover Apple TVs and connect to devices on your local network.
        NSBonjourServices:
          - _apple-mobdev2._tcp
          - _companion-link._tcp
          - _airplay._tcp
          - _remotepairing._tcp
          - _remoted._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srgtcauliflour.atvloadly
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Manual
